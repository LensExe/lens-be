---
name: bookings/:booking_id/gallery/publish
'$kind': http-request
url: '{{baseUrl}}/bookings/{{bookingId}}/gallery/publish'
method: POST
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Publish gallery
  Handler: publish
  Authentication: role 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
