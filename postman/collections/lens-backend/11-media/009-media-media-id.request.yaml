---
name: media/:media_id
'$kind': http-request
url: '{{baseUrl}}/media/{{mediaId}}'
method: DELETE
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Xóa media
  Handler: remove
  Authentication: Bearer token
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
