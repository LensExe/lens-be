---
name: bookings/:booking_id/gallery
'$kind': http-request
url: '{{baseUrl}}/bookings/{{bookingId}}/gallery'
method: POST
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Tạo gallery booking
  Handler: createGallery
  Authentication: role 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
