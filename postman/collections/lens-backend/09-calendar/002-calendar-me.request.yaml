---
name: calendar/me
'$kind': http-request
url: '{{baseUrl}}/calendar/me?from={{fromDateTime}}&to={{toDateTime}}'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Xem lịch cá nhân
  Handler: me
  Authentication: role 'photographer'
  Query: CalendarMeQueryQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
