---
name: customers/me
'$kind': http-request
url: '{{baseUrl}}/customers/me'
method: GET
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Xem customer profile của mình
  Handler: me
  Authentication: Bearer token
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
