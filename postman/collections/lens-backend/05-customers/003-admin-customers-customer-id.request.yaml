---
name: admin/customers/:customer_id
'$kind': http-request
url: '{{baseUrl}}/admin/customers/{{customerId}}'
method: GET
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Admin xem customer profile
  Handler: adminGet
  Authentication: role 'admin'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
