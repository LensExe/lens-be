---
name: customers/me/recommendations
'$kind': http-request
url: '{{baseUrl}}/customers/me/recommendations?limit=20&offset=0'
method: GET
headers:
  - key: Authorization
    value: Bearer {{customerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Gợi ý thợ ảnh cho khách hàng theo profile
  Handler: recommend
  Authentication: role 'customer'
  Query: CustomerRecommendQueryQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
