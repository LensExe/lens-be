---
name: admin/customers
'$kind': http-request
url: '{{baseUrl}}/admin/customers?limit=20&offset=0&keyword=postman'
method: GET
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Admin xem danh sách khách hàng
  Handler: adminList
  Authentication: role 'admin'
  Query: CustomerAdminListQueryQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
