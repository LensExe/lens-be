---
name: auth/change-password
'$kind': http-request
url: '{{baseUrl}}/auth/change-password'
method: POST
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "{{newPassword}}",
      "new_password": "{{registrationPassword}}",
      "confirm_password": "{{registrationPassword}}"
    }
auth:
  type: noauth
description: |-
  Thay đổi mật khẩu
  Handler: changePassword
  Authentication: Bearer token
  Body: AuthChangePasswordDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
