---
name: auth/forgot-password/send-otp
'$kind': http-request
url: '{{baseUrl}}/auth/forgot-password/send-otp'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{registrationEmail}}"
    }
auth:
  type: noauth
description: |-
  Quên mật khẩu. Gửi OTP
  Handler: sendForgotPasswordOtp
  Authentication: public
  Body: AuthSendOtpDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
