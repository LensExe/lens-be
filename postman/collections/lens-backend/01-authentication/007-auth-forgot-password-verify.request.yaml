---
name: auth/forgot-password/verify
'$kind': http-request
url: '{{baseUrl}}/auth/forgot-password/verify'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{registrationEmail}}",
      "otp": "705601"
    }
auth:
  type: noauth
description: |-
  Xác minh OTP quên mật khẩu
  Handler: verifyForgotPasswordOtp
  Authentication: public
  Body: AuthVerifyForgotPasswordOtpDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
