---
name: auth/email/send-otp
'$kind': http-request
url: '{{baseUrl}}/auth/email/send-otp'
method: POST
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Gửi OTP xác minh Email
  Handler: sendEmailOtp
  Authentication: Bearer token
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
