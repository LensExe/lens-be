---
name: booking-plans/:booking_plan_id
'$kind': http-request
url: '{{baseUrl}}/booking-plans/{{bookingPlanId}}'
method: DELETE
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Xoá gói chụp
  Handler: remove
  Authentication: role 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
