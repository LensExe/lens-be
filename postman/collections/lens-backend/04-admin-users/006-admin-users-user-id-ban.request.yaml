---
name: admin/users/:user_id/ban
'$kind': http-request
url: '{{baseUrl}}/admin/users/{{userId}}/ban'
method: POST
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Cấm tài khoản vĩnh viễn
  Handler: ban
  Authentication: role 'admin'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
