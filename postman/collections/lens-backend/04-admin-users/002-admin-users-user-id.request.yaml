---
name: admin/users/:user_id
'$kind': http-request
url: '{{baseUrl}}/admin/users/{{userId}}'
method: GET
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Chi tiết user
  Handler: adminUser
  Authentication: role 'admin'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
