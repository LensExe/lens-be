---
name: admin/reviews
'$kind': http-request
url: '{{baseUrl}}/admin/reviews?limit=20&offset=0'
method: GET
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Admin xem danh sách đánh giá
  Handler: adminList
  Authentication: role 'admin'
  Query: ReviewAdminListQueryQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
