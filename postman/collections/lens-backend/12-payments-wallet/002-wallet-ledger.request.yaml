---
name: wallet/ledger
'$kind': http-request
url: '{{baseUrl}}/wallet/ledger?limit=20&offset=0'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Lịch sử biến động ví
  Handler: walletLedger
  Authentication: role 'customer', 'photographer'
  Query: PaymentWalletLedgerQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
