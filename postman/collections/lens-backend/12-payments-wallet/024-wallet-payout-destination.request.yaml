---
name: wallet/payout-destination
'$kind': http-request
url: '{{baseUrl}}/wallet/payout-destination'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Xem tài khoản nhận tiền rút ví đã đăng ký.
  Số tài khoản chỉ được trả về dạng che, ví dụ ••••6789.
  Authentication: role 'customer', 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
