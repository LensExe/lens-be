---
name: bookings/:booking_id/payments/deposit
'$kind': http-request
url: '{{baseUrl}}/bookings/{{bookingId}}/payments/deposit'
method: POST
headers:
  - key: Authorization
    value: Bearer {{customerToken}}
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "idempotency_key": "postman-local-deposit-001",
      "payment_method": "gateway"
    }
auth:
  type: noauth
description: |-
  Tạo thanh toán đặt cọc
  Handler: deposit
  Authentication: role 'customer'
  Body: PaymentDepositCommandBodyDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
