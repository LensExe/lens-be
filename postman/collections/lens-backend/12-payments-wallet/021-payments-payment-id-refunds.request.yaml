---
name: payments/:payment_id/refunds
'$kind': http-request
url: '{{baseUrl}}/payments/{{paymentId}}/refunds'
method: GET
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Lịch sử hoàn tiền
  Handler: refunds
  Authentication: role 'customer', 'admin'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
