---
name: payments/webhooks/:provider
'$kind': http-request
url: '{{baseUrl}}/payments/webhooks/{{provider}}'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "TEST",
      "desc": "Postman smoke test",
      "success": false,
      "data": {},
      "signature": "invalid"
    }
auth:
  type: noauth
description: |-
  Webhook cổng thanh toán
  Handler: webhook
  Authentication: public
  Body: Record
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
