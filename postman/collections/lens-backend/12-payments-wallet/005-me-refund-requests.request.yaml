---
name: me/refund-requests
'$kind': http-request
url: '{{baseUrl}}/me/refund-requests?limit=20&offset=0'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Danh sách yêu cầu refund/rút ví của tôi
  Handler: myRefundRequests
  Authentication: role 'customer', 'photographer'
  Query: PaymentWalletLedgerQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
