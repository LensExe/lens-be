---
name: wallet/payout-destination/save
'$kind': http-request
url: '{{baseUrl}}/wallet/payout-destination'
method: PUT
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "bank_code": "970436",
      "account_number": "0123456789",
      "account_name": "POSTMAN TEST"
    }
auth:
  type: noauth
description: |-
  Đăng ký hoặc cập nhật tài khoản ngân hàng nhận tiền rút ví.
  Thông tin đầy đủ được mã hóa trong backend; response chỉ trả về số tài khoản đã che.
  Authentication: role 'customer', 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
