---
name: admin/bookings/:booking_id/escrow/extend-release
'$kind': http-request
url: '{{baseUrl}}/admin/bookings/{{bookingId}}/escrow/extend-release'
method: POST
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "hours": 24,
      "reason": "Postman API test deadline extension"
    }
auth:
  type: noauth
description: |-
  Gia hạn thời gian giải ngân escrow
  Handler: extendEscrowRelease
  Authentication: role 'admin'
  Body: PaymentDeadlineExtensionBodyDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
