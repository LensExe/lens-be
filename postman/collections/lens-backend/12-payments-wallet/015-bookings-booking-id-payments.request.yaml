---
name: bookings/:booking_id/payments
'$kind': http-request
url: '{{baseUrl}}/bookings/{{bookingId}}/payments'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Lịch sử thanh toán booking
  Handler: history
  Authentication: role 'customer', 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
