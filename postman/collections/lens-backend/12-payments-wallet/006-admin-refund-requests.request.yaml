---
name: admin/refund-requests
'$kind': http-request
url: '{{baseUrl}}/admin/refund-requests?limit=20&offset=0'
method: GET
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Danh sách refund/rút tiền cần xử lý
  Handler: adminRefundRequests
  Authentication: role 'admin'
  Query: PaymentRefundQueueQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
