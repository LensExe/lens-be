---
name: payments/:payment_id
'$kind': http-request
url: '{{baseUrl}}/payments/{{paymentId}}'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Chi tiết thanh toán
  Handler: get
  Authentication: role 'customer', 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
