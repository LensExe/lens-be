---
name: reports/me
'$kind': http-request
url: '{{baseUrl}}/reports/me?limit=20&offset=0'
method: GET
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Report của tôi
  Handler: mine
  Authentication: Bearer token
  Query: ModerationMineQueryQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
