---
name: portfolios/:portfolio_id/items/:portfolio_item_id
'$kind': http-request
url: '{{baseUrl}}/portfolios/{{portfolioId}}/items/{{portfolioItemId}}'
method: DELETE
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Xóa ảnh khỏi portfolio
  Handler: removeItem
  Authentication: role 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
