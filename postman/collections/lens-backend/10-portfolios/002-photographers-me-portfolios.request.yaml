---
name: photographers/me/portfolios
'$kind': http-request
url: '{{baseUrl}}/photographers/me/portfolios'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Danh sách portfolio của photographer đang đăng nhập
  Handler: myList
  Authentication: role 'photographer'
  Query: PortfolioListQueryQueryDto
queryParams:
  - key: limit
    value: '20'
    disabled: true
  - key: offset
    value: '0'
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
