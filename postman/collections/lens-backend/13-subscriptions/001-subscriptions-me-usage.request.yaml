---
name: subscriptions/me/usage
'$kind': http-request
url: '{{baseUrl}}/subscriptions/me/usage'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Xem usage/quota
  Handler: usage
  Authentication: role 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
