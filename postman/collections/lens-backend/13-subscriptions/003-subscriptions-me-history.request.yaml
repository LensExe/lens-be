---
name: subscriptions/me/history
'$kind': http-request
url: '{{baseUrl}}/subscriptions/me/history'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Lịch sử subscription
  Handler: history
  Authentication: role 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
