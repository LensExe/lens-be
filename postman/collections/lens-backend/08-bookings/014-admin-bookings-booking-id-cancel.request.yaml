---
name: admin/bookings/:booking_id/cancel
'$kind': http-request
url: '{{baseUrl}}/admin/bookings/{{bookingId}}/cancel'
method: POST
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Postman API test cancellation"
    }
auth:
  type: noauth
description: |-
  Admin huỷ booking
  Handler: adminCancel
  Authentication: role 'admin'
  Body: BookingCancelCommandBodyDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
