---
name: bookings/:booking_id/start
'$kind': http-request
url: '{{baseUrl}}/bookings/{{bookingId}}/start'
method: POST
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Bắt đầu buổi chụp
  Handler: start
  Authentication: role 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
