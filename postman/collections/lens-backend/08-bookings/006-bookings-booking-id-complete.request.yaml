---
name: bookings/:booking_id/complete
'$kind': http-request
url: '{{baseUrl}}/bookings/{{bookingId}}/complete'
method: POST
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Hoàn tất booking
  Handler: complete
  Authentication: role 'admin', 'system'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
