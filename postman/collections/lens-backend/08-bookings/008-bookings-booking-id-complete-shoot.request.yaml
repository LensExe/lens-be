---
name: bookings/:booking_id/complete-shoot
'$kind': http-request
url: '{{baseUrl}}/bookings/{{bookingId}}/complete-shoot'
method: POST
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Xác nhận chụp xong
  Handler: completeShoot
  Authentication: role 'photographer'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
