---
name: bookings/:booking_id
'$kind': http-request
url: '{{baseUrl}}/bookings/{{bookingId}}'
method: GET
headers:
  - key: Authorization
    value: Bearer {{adminToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Chi tiết booking
  Handler: get
  Authentication: role 'customer', 'photographer', 'admin'
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
