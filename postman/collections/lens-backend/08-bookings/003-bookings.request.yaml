---
name: bookings
'$kind': http-request
url: '{{baseUrl}}/bookings?limit=20&offset=0'
method: GET
headers:
  - key: Authorization
    value: Bearer {{photographerToken}}
body:
  type: none
auth:
  type: noauth
description: |-
  Danh sách booking
  Handler: list
  Authentication: role 'customer', 'photographer'
  Query: BookingListQueryQueryDto
scripts:
  - type: afterResponse
    code: |-
      pm.test("responds without a server error", function () {
        pm.expect(pm.response.code).to.be.below(500);
      });
