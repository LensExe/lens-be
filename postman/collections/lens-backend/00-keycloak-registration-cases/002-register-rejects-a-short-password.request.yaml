---
name: Register rejects a short password
'$kind': http-request
url: '{{baseUrl}}/auth/register'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "role": "customer",
      "fullname": "Postman Test User",
      "email": "{{registrationEmail}}",
      "password": "123"
    }
auth:
  type: noauth
description: |-
  Register rejects a short password.
  Dùng biến Lens Backend Local Postman environment; request này gọi Keycloak và có thể tạo account thật trong realm local.
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns expected status 400", function () {
        pm.expect(pm.response.code).to.equal(400);
      });
