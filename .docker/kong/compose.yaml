name: kong-gateway

services:
  lens-kong:
    image: kong:3.9.3
    container_name: lens-kong
    ports:
      - '127.0.0.1:8000:8000' # local proxy
      - '127.0.0.1:8001:8001' # local/private Admin API
    volumes:
      # Generate this file first with `pnpm docker:gateway:check` or
      # `pnpm docker:gateway`; it contains the current Keycloak JWKS keys.
      - ./:/kong/declarative:ro
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.generated.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_HEADERS: 'server_tokens,latency_tokens,X-Kong-Request-Id'
      KONG_HEADERS_UPSTREAM: 'X-Kong-Request-Id'
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 'off'
      KONG_NGINX_WORKER_PROCESSES: '1'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - lens-network
    restart: unless-stopped

networks:
  lens-network:
    name: lens-network
    external: true
