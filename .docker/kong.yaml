services:
  # ── Kong Migrations (Khởi tạo DB cho Kong) ──
  kong-migrations:
    image: kong:3.6
    container_name: lens-kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: host.docker.internal
      KONG_PG_PORT: 5433
      KONG_PG_USER: lens-postgres
      KONG_PG_PASSWORD: 'Postgres@#_Lens_EXE202_FPT_FA26'
      KONG_PG_DATABASE: kong
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'no'

  # ── Kong Gateway + Kong Manager GUI ──
  kong:
    image: kong:3.6
    container_name: lens-kong
    depends_on:
      - kong-migrations
    ports:
      - '8000:8000' # Kong Proxy (HTTP traffic)
      - '8443:8443' # Kong Proxy (HTTPS traffic)
      - '8001:8001' # Kong Admin API
      - '8002:8002' # Kong Manager (Web GUI Dashboard)
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: host.docker.internal
      KONG_PG_PORT: 5433
      KONG_PG_USER: lens-postgres
      KONG_PG_PASSWORD: 'Postgres@#_Lens_EXE202_FPT_FA26'
      KONG_PG_DATABASE: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://localhost:8002
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
