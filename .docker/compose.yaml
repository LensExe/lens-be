name: lens-backend

services:
  # ── PostgreSQL (primary datasource; tự động tạo lens, kong, keycloak qua init.sql) ──
  postgres:
    image: postgres:16-alpine
    container_name: lens-postgres
    environment:
      POSTGRES_USER: lens-postgres
      POSTGRES_PASSWORD: Postgres@#_Lens_EXE202_FPT_FA26
      POSTGRES_DB: lens
    ports:
      - '5433:5432' # host 5433 → matches POSTGRESQL_PRIMARY_PORT in .env
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lens-postgres -d lens']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lens-network
    restart: unless-stopped

  # ── 2. MongoDB (Read DB / Query Side - Lưu Denormalized Read Views cho CQRS) ──
  mongodb:
    image: mongo:7-jammy
    container_name: lens-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: lens-mongo
      MONGO_INITDB_ROOT_PASSWORD: Mongo@#_Lens_EXE202_FPT_FA26
      MONGO_INITDB_DATABASE: lens_read
    ports:
      - '27018:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lens-network
    restart: unless-stopped

  # ── 3. Redis (Cache, CQRS Event Bus, BullMQ Queue, Socket.io) ──
  redis:
    image: redis:7-alpine
    container_name: lens-redis
    command: ['redis-server', '--requirepass', 'Redis@#_Lens_EXE202_FPT_FA26']
    ports:
      - '6380:6379' # host 6380 → matches REDIS_*_PORT in .env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'Redis@#_Lens_EXE202_FPT_FA26', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lens-network
    restart: unless-stopped

  # ── MinIO (S3-compatible Object Storage) ──
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: lens-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: LensMinioAdmin # S3_MINIO_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD: Minio@#_Lens_EXE202_FPT_FA26 # S3_MINIO_SECRET_ACCESS_KEY
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web UI Console
    volumes:
      - minio-data:/data
    networks:
      - lens-network
    restart: unless-stopped

  # ── MinIO Init (one-shot: tự tạo bucket `lens` và cấp quyền public download) ──
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: lens-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 2;
        mc alias set local http://minio:9000 'LensMinioAdmin' 'Minio@#_Lens_EXE202_FPT_FA26';
        mc mb --ignore-existing local/lens;
        mc anonymous set download local/lens;
        echo 'MinIO bucket ready';
        exit 0;
      "
    environment:
      S3_MINIO_ACCESS_KEY_ID: LensMinioAdmin
      S3_MINIO_SECRET_ACCESS_KEY: Minio@#_Lens_EXE202_FPT_FA26
      S3_MINIO_BUCKET: lens
    networks:
      - lens-network
    restart: 'no'

  # ── Keycloak (Identity & Access Management; lưu dữ liệu vào Postgres DB keycloak) ──
  keycloak:
    profiles: ['full']
    image: quay.io/keycloak/keycloak:24.0
    container_name: lens-keycloak
    command: ['start-dev', '--http-port=8080']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: lens-admin-keycloak
      KEYCLOAK_ADMIN_PASSWORD: Keycloak@#_Lens_EXE202_FPT_FA26
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: lens-postgres
      KC_DB_PASSWORD: Postgres@#_Lens_EXE202_FPT_FA26
    ports:
      - '8089:8080' # KEYCLOAK_URL=http://localhost:8089
    networks:
      - lens-network
    restart: unless-stopped

  # ── Kong Migrations (Khởi tạo database schema cho Kong Gateway) ──
  kong-migrations:
    profiles: ['full']
    image: kong:3.6
    container_name: lens-kong-migrations
    command: kong migrations bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_USER: lens-postgres
      KONG_PG_PASSWORD: 'Postgres@#_Lens_EXE202_FPT_FA26'
      KONG_PG_DATABASE: kong
    networks:
      - lens-network
    restart: 'no'

  kong:
    profiles: ['full']
    image: kong:3.6
    container_name: lens-kong
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - '8000:8000' # Kong Proxy HTTP
      - '8001:8001' # Kong Admin API
      - '8002:8002' # Kong Manager GUI
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_USER: lens-postgres
      KONG_PG_PASSWORD: 'Postgres@#_Lens_EXE202_FPT_FA26'
      KONG_PG_DATABASE: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://localhost:8002
    networks:
      - lens-network
    restart: unless-stopped

volumes:
  pg-data:
    name: lens-pg-data
  mongo-data:
    name: lens-mongo-data
  redis-data:
    name: lens-redis-data
  minio-data:
    name: lens-minio-data

networks:
  lens-network:
    name: lens-network
    driver: bridge
