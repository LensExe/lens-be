name: lens-backend

services:
  # ── PostgreSQL (primary datasource; tự động tạo lens, kong, keycloak qua init.sql) ──
  postgres:
    image: postgres:16-alpine
    container_name: lens-postgres
    environment:
      POSTGRES_USER: lens-postgres
      POSTGRES_PASSWORD: Postgres@#_Lens_EXE202_FPT_FA26
      POSTGRES_DB: lens
    ports:
      - '5433:5432' # host 5433 → matches POSTGRESQL_PRIMARY_PORT in .env
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lens-postgres -d lens']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lens-network
    restart: unless-stopped

  # ── Redis (cache + bullmq + throttler + socketio adapter) ──
  redis:
    image: redis:7-alpine
    container_name: lens-redis
    command: ['redis-server', '--requirepass', 'Redis@#_Lens_EXE202_FPT_FA26']
    ports:
      - '6380:6379' # host 6380 → matches REDIS_*_PORT in .env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'Redis@#_Lens_EXE202_FPT_FA26', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lens-network
    restart: unless-stopped

  # ── MinIO (S3-compatible Object Storage) ──
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: lens-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: LensMinioAdmin # S3_MINIO_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD: Minio@#_Lens_EXE202_FPT_FA26 # S3_MINIO_SECRET_ACCESS_KEY
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # MinIO Console Web UI
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lens-network
    restart: unless-stopped

  # ── MinIO Init (one-shot: tự tạo bucket `lens` và cấp quyền public download) ──
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: lens-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 LensMinioAdmin 'Minio@#_Lens_EXE202_FPT_FA26' &&
        mc mb --ignore-existing local/lens &&
        mc anonymous set download local/lens &&
        echo "MinIO bucket ready"
    networks:
      - lens-network
    restart: 'no'

  # ── Keycloak (Identity & Access Management; lưu dữ liệu vào Postgres DB keycloak) ──
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: lens-keycloak
    command: ['start-dev', '--http-port=8080']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: lens-admin-keycloak
      KEYCLOAK_ADMIN_PASSWORD: Keycloak@#_Lens_EXE202_FPT_FA26
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: lens-postgres
      KC_DB_PASSWORD: Postgres@#_Lens_EXE202_FPT_FA26
    ports:
      - '8089:8080' # KEYCLOAK_URL=http://localhost:8089
    networks:
      - lens-network
    restart: unless-stopped

  # ── Kong Migrations (Khởi tạo database schema cho Kong Gateway) ──
  kong-migrations:
    image: kong:3.6
    container_name: lens-kong-migrations
    command: kong migrations bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_USER: lens-postgres
      KONG_PG_PASSWORD: 'Postgres@#_Lens_EXE202_FPT_FA26'
      KONG_PG_DATABASE: kong
    networks:
      - lens-network
    restart: 'no'

  # ── Kong Gateway + Kong Manager GUI ──
  kong:
    image: kong:3.6
    container_name: lens-kong
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - '8000:8000' # Kong Proxy (HTTP traffic)
      - '8443:8443' # Kong Proxy (HTTPS traffic)
      - '8001:8001' # Kong Admin API
      - '8002:8002' # Kong Manager (Official Web Dashboard)
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_USER: lens-postgres
      KONG_PG_PASSWORD: 'Postgres@#_Lens_EXE202_FPT_FA26'
      KONG_PG_DATABASE: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://localhost:8002
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - lens-network
    restart: unless-stopped

volumes:
  pg-data:
    name: lens-pg-data
  redis-data:
    name: lens-redis-data
  minio-data:
    name: lens-minio-data

networks:
  lens-network:
    name: lens-network
    driver: bridge
