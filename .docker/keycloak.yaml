services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: lens-keycloak
    command: ['start-dev', '--http-port=8080']
    ports:
      - '8089:8080'
    environment:
      KEYCLOAK_ADMIN: lens-admin-keycloak
      KEYCLOAK_ADMIN_PASSWORD: Keycloak@#_Lens_EXE202_FPT_FA26
      KC_DB: postgres
      KC_DB_URL_HOST: host.docker.internal
      KC_DB_URL_PORT: 5433
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: lens-postgres
      KC_DB_PASSWORD: Postgres@#_Lens_EXE202_FPT_FA26
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
