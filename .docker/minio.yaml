services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: lens-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: LensMinioAdmin
      MINIO_ROOT_PASSWORD: Minio@#_Lens_EXE202_FPT_FA26
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web Console
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lens-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: lens-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 LensMinioAdmin 'Minio@#_Lens_EXE202_FPT_FA26' &&
        mc mb --ignore-existing local/lens &&
        mc anonymous set download local/lens &&
        echo "MinIO bucket ready"
    networks:
      - lens-network
    restart: 'no'

volumes:
  minio-data:
    name: lens-minio-data

networks:
  lens-network:
    name: lens-network
    driver: bridge
