name: lens-backend

services:
  # ── Lens API (built from the repository Dockerfile) ──
  # Runtime secrets are loaded from the ignored root .env.production file.
  # They are deliberately not copied into the image during docker build.
  lens-backend:
    profiles: ['app']
    image: lens-backend:local
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env.production
    ports:
      - '${BACKEND_HOST_PORT:-3000}:3000'
    depends_on:
      lens-postgres:
        condition: service_healthy
      lens-redis:
        condition: service_healthy
      lens-minio-init:
        condition: service_completed_successfully
      lens-keycloak:
        condition: service_started
    networks:
      - lens-network
    restart: unless-stopped

  # ── PostgreSQL (primary data source; automatically creates lens, kong, and keycloak via init.sql) ──
  lens-postgres:
    image: postgres:16-alpine
    container_name: lens-postgres
    environment:
      POSTGRES_USER: lens-postgres
      POSTGRES_PASSWORD: Postgres@#_Lens_EXE202_FPT_FA26
      POSTGRES_DB: lens
    ports:
      - '5432:5432' # host 5433 → matches POSTGRESQL_PRIMARY_PORT in .env
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lens-postgres -d lens']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lens-network
    restart: unless-stopped

  # ── 3. Redis (Cache, CQRS Event Bus, BullMQ Queue, Socket.io) ──
  lens-redis:
    image: redis:7-alpine
    container_name: lens-redis
    command: ['redis-server', '--requirepass', 'Redis@#_Lens_EXE202_FPT_FA26']
    environment:
      REDIS_PASSWORD: 'Redis@#_Lens_EXE202_FPT_FA26'
    ports:
      - '6380:6379' # host 6380 → matches REDIS_*_PORT in .env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lens-network
    restart: unless-stopped

  # ── MinIO (S3-compatible Object Storage) ──
  lens-minio:
    image: docker.io/minio/minio:latest
    container_name: lens-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: LensMinioAdmin # S3_MINIO_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD: Minio@#_Lens_EXE202_FPT_FA26 # S3_MINIO_SECRET_ACCESS_KEY
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web UI Console
    volumes:
      - minio-data:/data
    networks:
      - lens-network
    restart: unless-stopped

  # ── MinIO initialization (one-shot: create the `lens` bucket and expose only the `public/` prefix) ──
  lens-minio-init:
    image: docker.io/minio/mc:latest
    container_name: lens-minio-init
    depends_on:
      - lens-minio
    entrypoint: >
      /bin/sh -c "
        sleep 2;
        mc alias set local http://lens-minio:9000 'LensMinioAdmin' 'Minio@#_Lens_EXE202_FPT_FA26';
        mc mb --ignore-existing local/lens;
        mc anonymous set download local/lens/public;
        echo 'MinIO bucket ready; only public/ is anonymously readable';
        exit 0;
      "
    environment:
      S3_MINIO_ACCESS_KEY_ID: LensMinioAdmin
      S3_MINIO_SECRET_ACCESS_KEY: Minio@#_Lens_EXE202_FPT_FA26
      S3_MINIO_BUCKET: lens
    networks:
      - lens-network
    restart: 'no'

  # ── Keycloak (identity and access management; stores data in the Postgres `keycloak` database) ──
  lens-keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: lens-keycloak
    command: ['start-dev', '--http-port=8080']
    depends_on:
      lens-postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: lens-admin-keycloak
      KEYCLOAK_ADMIN_PASSWORD: Keycloak@#_Lens_EXE202_FPT_FA26
      KC_DB: postgres
      KC_DB_URL_HOST: lens-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: lens-postgres
      KC_DB_PASSWORD: Postgres@#_Lens_EXE202_FPT_FA26
    ports:
      - '8089:8080' # KEYCLOAK_URL=http://localhost:8089
    networks:
      - lens-network
    restart: unless-stopped

  # ── Kong migrations (initialize the Kong Gateway database schema) ──
  lenskong-migrations:
    image: kong:3.6
    container_name: lens-kong-migrations
    command: kong migrations bootstrap
    depends_on:
      lens-postgres:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: lens-postgres
      KONG_PG_PORT: 5432
      KONG_PG_USER: lens-postgres
      KONG_PG_PASSWORD: 'Postgres@#_Lens_EXE202_FPT_FA26'
      KONG_PG_DATABASE: kong
    networks:
      - lens-network
    restart: 'no'

  lens-kong:
    profiles: ['full']
    image: kong:3.6
    container_name: lens-kong
    depends_on:
      lenskong-migrations:
        condition: service_completed_successfully
      lens-postgres:
        condition: service_healthy
    ports:
      - '8000:8000' # Kong Proxy HTTP
      - '8001:8001' # Kong Admin API
      - '8002:8002' # Kong Manager GUI
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: lens-postgres
      KONG_PG_PORT: 5432
      KONG_PG_USER: lens-postgres
      KONG_PG_PASSWORD: 'Postgres@#_Lens_EXE202_FPT_FA26'
      KONG_PG_DATABASE: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://localhost:8002
    networks:
      - lens-network
    restart: unless-stopped

volumes:
  pg-data:
    name: lens-pg-data
  mongo-data:
    name: lens-mongo-data
  redis-data:
    name: lens-redis-data
  minio-data:
    name: lens-minio-data

networks:
  lens-network:
    name: lens-network
    external: true
