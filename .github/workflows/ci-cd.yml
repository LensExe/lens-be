name: Lens Backend CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Validate backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  publish:
    name: Publish backend image
    if: ${{ github.event_name != 'pull_request' }}
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/lens-backend
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Redeploy Portainer stack
    if: ${{ github.event_name != 'pull_request' }}
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Trigger Portainer webhook
        if: ${{ env.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          webhook_url="$PORTAINER_WEBHOOK_URL"
          if [[ "$webhook_url" == *\?* ]]; then
            webhook_url="${webhook_url}&IMAGE_TAG=${IMAGE_TAG}"
          else
            webhook_url="${webhook_url}?IMAGE_TAG=${IMAGE_TAG}"
          fi
          curl --fail-with-body --silent --show-error --retry 3 \
            --retry-all-errors --request POST "$webhook_url"

      - name: Skip Portainer redeploy when webhook is not configured
        if: ${{ env.PORTAINER_WEBHOOK_URL == '' }}
        run: echo "PORTAINER_WEBHOOK_URL is not configured; image was published only."
