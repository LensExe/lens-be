services:
  lens-ai-worker:
    image: '${AI_WORKER_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-lensexe}/lens-ai-worker:${IMAGE_TAG:-latest}}'
    pull_policy: '${AI_WORKER_PULL_POLICY:-always}'
    container_name: lens-ai-worker
    environment:
      NODE_ENV: production
      AI_WORKER_PORT: '3001'
      AI_WORKER_ENABLED: '${AI_WORKER_ENABLED:-true}'
      AI_AUTO_REPLY_ENABLED: '${AI_AUTO_REPLY_ENABLED:-true}'
      KAFKA_ENABLED: '${KAFKA_ENABLED:-true}'
      KAFKA_BROKERS: '${KAFKA_BROKERS:-kafka:9094}'
      AI_WORKER_CLIENT_ID: '${AI_WORKER_CLIENT_ID:-lens-ai-worker}'
      AI_WORKER_GROUP_ID: '${AI_WORKER_GROUP_ID:-lens-ai-reply-worker}'
      KAFKA_CHAT_EVENTS_TOPIC: '${KAFKA_CHAT_EVENTS_TOPIC:-chat.conversation.events.v1}'
      KAFKA_USERNAME: '${KAFKA_USERNAME:-kafka}'
      KAFKA_PASSWORD: '${KAFKA_PASSWORD:?Set KAFKA_PASSWORD in Portainer}'
      KAFKA_SSL: '${KAFKA_SSL:-false}'
      REDIS_HOST: '${REDIS_HOST:-lens-redis}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}'
      BULLMQ_REDIS_DB: '${BULLMQ_REDIS_DB:-2}'
      AI_PRESENCE_REDIS_HOST: '${AI_PRESENCE_REDIS_HOST:-lens-redis}'
      AI_PRESENCE_REDIS_PORT: '${AI_PRESENCE_REDIS_PORT:-6379}'
      AI_PRESENCE_REDIS_DB: '${AI_PRESENCE_REDIS_DB:-1}'
      AI_DB_HOST: '${AI_DB_HOST:-lens-postgres}'
      AI_DB_PORT: '${AI_DB_PORT:-5432}'
      AI_DB_USERNAME: '${AI_DB_USERNAME:-lens-postgres}'
      AI_DB_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}'
      AI_DB_NAME: '${AI_DB_NAME:-lens_ai}'
      AI_SOURCE_DB_HOST: '${AI_SOURCE_DB_HOST:-lens-postgres}'
      AI_SOURCE_DB_PORT: '${AI_SOURCE_DB_PORT:-5432}'
      AI_SOURCE_DB_USERNAME: '${AI_SOURCE_DB_USERNAME:-lens-postgres}'
      AI_SOURCE_DB_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}'
      AI_SOURCE_DB_NAME: '${AI_SOURCE_DB_NAME:-lens}'
      CHAT_SERVICE_BASE_URL: '${CHAT_SERVICE_BASE_URL:-http://lens-chat:8080}'
      CHAT_SERVICE_AI_TOKEN: '${CHAT_SERVICE_AI_TOKEN:?Set CHAT_SERVICE_AI_TOKEN to the same value as Chat Service AI_WORKER_TOKEN}'
      CHAT_SERVICE_TIMEOUT_MS: '${CHAT_SERVICE_TIMEOUT_MS:-10000}'
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-http://ollama:11434}'
      AI_CHAT_MODEL: '${AI_CHAT_MODEL:-qwen3.5:2b}'
      AI_EMBEDDING_MODEL: '${AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}'
      AI_OFFLINE_REPLY_DELAY_MS: '${AI_OFFLINE_REPLY_DELAY_MS:-15000}'
      AI_OFFLINE_REPLY_POLL_MS: '${AI_OFFLINE_REPLY_POLL_MS:-30000}'
      AI_OFFLINE_REPLY_MAX_WAIT_MS: '${AI_OFFLINE_REPLY_MAX_WAIT_MS:-600000}'
    networks:
      - lens-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  lens-network:
    external: true
    name: lens-network
