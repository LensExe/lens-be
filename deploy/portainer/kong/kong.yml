  - username: keycloak
    jwt_secrets:
      - key: EQWCcBpQdfTslnxOmyGfvIjfLxiC3s-yVs9dHVOlu3A
        algorithm: RS256
        secret: kong-does-not-use-this-for-rs256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlYynkYmpksFtyBi5Hqkf
          yg9b7PoWKdD0IcePbSybq/BlRSL+I09bD2umsdEtGU/AJSV227Tka2Pvn1JGPQmc
          MHJpR51l7h45PA0gN7G6jj4OnoJ54QITWWzZhs2dYjDWu10yUZMb8soowuDFp42d
          +eOWFKBzcmBc8DXH39Zf69GLMEpXhpuadOIo9h91J+uCbC05BAoTC8v6lqPFXnJw
          W9TvpkPFc++S2nQtOtOa2EeztOYmcqK+x2gBnzYfA369nh6MB+TImkzHPvTH2epY
          Cq1K7yaurtDk5lPvMts+96vKQDaO1tUd6XRMXIWRer6/DORwHT/G8XKc4B7HowHk
          MwIDAQAB
          -----END PUBLIC KEY-----

services:
  - name: core-backend
    url: http://lens-backend:3000
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    # Avoid retrying payment and other non-idempotent writes at the gateway.
    retries: 0
    routes:
      # These public routes are deliberately method- and path-specific. They
      # take precedence over core-api-v1, which requires JWT for everything else.
      - name: core-public-get-static
        paths:
          - '~^/api/v1/(?:photographers/?|photographers/top-rated/?|ranks/?|badges/?|subscriptions/plans/?|keycloak/google/(?:login|callback|exchange)/?)$'
        methods: [GET]
        regex_priority: 100
        protocols: [http, https]
        strip_path: false

      - name: core-public-photographer-profile
        paths:
          - '~^/api/v1/photographers/(?!me(?:/|$)|top-rated(?:/|$))[^/]+/?$'
        methods: [GET]
        regex_priority: 100
        protocols: [http, https]
        strip_path: false

      - name: core-public-photographer-resources
        paths:
          - '~^/api/v1/photographers/(?!me(?:/|$))[^/]+/(?:portfolios|booking-plans|rating-summary|reviews|availability|offline-slots)/?$'
        methods: [GET]
        regex_priority: 100
        protocols: [http, https]
        strip_path: false

      - name: core-public-portfolio
        paths:
          - '~^/api/v1/portfolios/[^/]+/?$'
        methods: [GET]
        regex_priority: 100
        protocols: [http, https]
        strip_path: false

      - name: core-public-webhooks
        paths:
          - '~^/api/v1/(?:payments|subscriptions)/webhooks/(?:payos|sepay)/?$'
        methods: [POST]
        regex_priority: 100
        protocols: [http, https]
        strip_path: false

      - name: core-auth-password-recovery
        paths:
          - /api/v1/auth/forgot-password/send-otp
          - /api/v1/auth/forgot-password/verify
          - /api/v1/auth/forgot-password/reset
        methods: [POST]
        protocols: [http, https]
        strip_path: false

      # Email verification is authenticated; do not put these routes in the
      # public password-recovery route above.
      - name: core-auth-email
        paths:
          - /api/v1/auth/email/send-otp
          - /api/v1/auth/email/verify
        methods: [POST]
        protocols: [http, https]
        strip_path: false

      - name: core-api-v1
        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/keycloak
          - /api/v1/customers
          - /api/v1/admin
          - /api/v1/photographers
          - /api/v1/booking-plans
          - /api/v1/ranks
          - /api/v1/badges
          - /api/v1/portfolios
          - /api/v1/calendar
          - /api/v1/bookings
          - /api/v1/payments
          - /api/v1/wallet
          - /api/v1/me
          - /api/v1/media
          - /api/v1/reviews
          - /api/v1/subscriptions
          - /api/v1/reports
        protocols: [http, https]
        strip_path: false

      # Public authentication endpoints need a lower edge quota than the
      # general API. Account/email cooldowns remain service responsibilities.
      - name: core-auth-login
        paths:
          - /api/v1/auth/register
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/logout
        methods: [POST]
        protocols: [http, https]
        strip_path: false

    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 3
          size_unit: megabytes
          require_content_length: false

  # Chat owns durable conversation/message APIs. Realtime delivery is handled
  # by Notification's Socket.IO gateway after Chat publishes Kafka events.
  - name: chat-api
    url: http://chat:8080
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: chat-api-v1
        paths:
          - /api/v1/chat
        protocols: [http, https]
        strip_path: false

    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 3
          size_unit: megabytes
          require_content_length: false

  # Notification exposes REST endpoints and a Socket.IO gateway. The
  # notification service must be attached to the external lens-network with
  # the Docker DNS name "notification" and listen on port 3001.
  - name: notification-api
    url: http://notification:3001
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: notification-http-v1
        paths:
          - /api/v1/notifications
          - /api/v1/mail
          - /api/v1/metrics
        protocols: [http, https]
        strip_path: false

      # Socket.IO first uses HTTP polling, then upgrades the same session to
      # WebSocket. Both protocol families must be accepted by this route.
      - name: notification-socket-v1
        paths:
          - /api/v1/socket.io
        protocols: [http, https]
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 3
          size_unit: megabytes
          require_content_length: false
