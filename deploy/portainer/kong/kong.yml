_format_version: '3.0'
_transform: true

# This file is the local/staging baseline for the Core API gateway.
# Keep origins environment-specific before deploying to production. Do not add
# a wildcard origin while credentials are enabled.
plugins:
  - name: cors
    config:
      origins:
        - https://api.lens.id.vn # lens-backend
        - https://lens.id.vn # landing page
        - https://app.lens.id.vn # portal page
        - https://admin.lens.id.vn # admin page
        - https://auth.lens.id.vn # lens-keycloak
      methods:
        - GET
        - HEAD
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Kong-Request-ID
      exposed_headers:
        - X-Kong-Request-ID
      credentials: true
      max_age: 3600
      preflight_continue: false
      allow_origin_absent: false

  # The ID is tracing metadata only. It is never used as an identity claim.
  - name: correlation-id
    config:
      header_name: X-Kong-Request-ID
      generator: uuid
      echo_downstream: true

  # Defense in depth: services still must ignore these headers and verify JWTs.
  - name: request-transformer
    config:
      remove:
        headers:
          - X-User-ID
          - X-User-Role
          - X-Authenticated-User

  # Prometheus scrapes the private Admin API; there is intentionally no public
  # /metrics route.
  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # General quota for every routed API, including public endpoints and chat.
  # The authentication routes below use stricter route-specific limits.
  - name: rate-limiting
    config:
      minute: 120
      limit_by: ip
      policy: local

  # Public API routes use a separate, lower quota than JWT-protected routes.
  - name: rate-limiting
    route: core-public-get-static
    config:
      minute: 60
      limit_by: ip
      policy: local

  - name: rate-limiting
    route: core-public-photographer-profile
    config:
      minute: 60
      limit_by: ip
      policy: local

  - name: rate-limiting
    route: core-public-photographer-resources
    config:
      minute: 60
      limit_by: ip
      policy: local

  - name: rate-limiting
    route: core-public-portfolio
    config:
      minute: 60
      limit_by: ip
      policy: local

  - name: rate-limiting
    route: core-public-webhooks
    config:
      minute: 60
      limit_by: ip
      policy: local

  - name: rate-limiting
    route: core-auth-login
    config:
      minute: 15
      limit_by: ip
      policy: local

  - name: rate-limiting
    route: core-auth-password-recovery
    config:
      minute: 5
      limit_by: ip
      policy: local

  - name: rate-limiting
    route: core-auth-email
    config:
      minute: 5
      limit_by: ip
      policy: local

  # JWT is scoped to protected routes. Explicit public routes below are not
  # bound to this plugin; the backend still performs its own full validation.
  - name: jwt
    route: core-api-v1
    config:
      key_claim_name: kid
      header_names: [authorization]
      cookie_names: []
      uri_param_names: []
      claims_to_verify: [exp]
      run_on_preflight: false

  - name: jwt
    route: core-auth-email
    config:
      key_claim_name: kid
      header_names: [authorization]
      cookie_names: []
      uri_param_names: []
      claims_to_verify: [exp]
      run_on_preflight: false

  - name: jwt
    route: chat-api-v1
    config:
      key_claim_name: kid
      header_names: [authorization]
      cookie_names: []
      uri_param_names: []
      claims_to_verify: [exp]
      run_on_preflight: false

  - name: jwt
    route: notification-http-v1
    config:
      key_claim_name: kid
      header_names: [authorization]
      cookie_names: []
      uri_param_names: []
      claims_to_verify: [exp]
      run_on_preflight: false

