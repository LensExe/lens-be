name: lens-kong

services:
  lens-kong:
    image: '${KONG_IMAGE:-kong:3.9.3}'
    container_name: lens-kong
    pull_policy: '${KONG_PULL_POLICY:-missing}'
    restart: unless-stopped
    environment:
      KONG_DATABASE: '${KONG_DATABASE:-off}'
      KONG_DECLARATIVE_CONFIG: '${KONG_DECLARATIVE_CONFIG:-/kong/declarative/kong.yml}'
      KONG_PROXY_LISTEN: '${KONG_PROXY_LISTEN:-0.0.0.0:8000}'
      KONG_ADMIN_LISTEN: '${KONG_ADMIN_LISTEN:-127.0.0.1:8001}'
      KONG_ADMIN_GUI_LISTEN: '${KONG_ADMIN_GUI_LISTEN:-off}'
      KONG_NGINX_WORKER_PROCESSES: '${KONG_NGINX_WORKER_PROCESSES:-1}'
      KONG_PROXY_ACCESS_LOG: '${KONG_PROXY_ACCESS_LOG:-/dev/stdout}'
      KONG_PROXY_ERROR_LOG: '${KONG_PROXY_ERROR_LOG:-/dev/stderr}'
      KONG_ADMIN_ACCESS_LOG: '${KONG_ADMIN_ACCESS_LOG:-/dev/stdout}'
      KONG_ADMIN_ERROR_LOG: '${KONG_ADMIN_ERROR_LOG:-/dev/stderr}'
    configs:
      - source: kong-config
        target: /kong/declarative/kong.yml
        mode: 0444
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lens-network
      - lens-proxy

networks:
  lens-network:
    name: lens-network
    external: true
  lens-proxy:
    name: lens-proxy
    external: true

configs:
  kong-config:
    file: '${KONG_CONFIG_PATH:-./kong.yml}'
