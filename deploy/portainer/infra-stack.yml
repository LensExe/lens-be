name: lens-infra

services:
  lens-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-lens}'
      POSTGRES_USER: '${POSTGRES_USER:-lens-postgres}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}'
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lens-network
    restart: unless-stopped

  # Keycloak uses a separate database from the Lens application database.
  lens-postgres-init:
    image: postgres:16-alpine
    depends_on:
      lens-postgres:
        condition: service_healthy
    environment:
      PGHOST: lens-postgres
      PGPORT: '5432'
      PGUSER: '${POSTGRES_USER:-lens-postgres}'
      PGPASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}'
    entrypoint: ['/bin/sh', '-ec']
    command: |
      if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1; then
        psql -d postgres -c 'CREATE DATABASE keycloak';
      fi
    networks:
      - lens-network
    restart: 'no'

  lens-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - '${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}'
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}'
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lens-network
    restart: unless-stopped

  lens-minio:
    # For a local Portainer import, load this exact image tag and set
    # MINIO_PULL_POLICY=never in the stack environment variables.
    image: '${MINIO_IMAGE:-minio/minio:RELEASE.2024-06-13T22-53-53Z}'
    pull_policy: '${MINIO_PULL_POLICY:-missing}'
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Portainer}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Portainer}'
    ports:
      - '${MINIO_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    networks:
      - lens-network
    restart: unless-stopped

  # Creates the Lens bucket and makes only public/ anonymously readable.
  lens-minio-init:
    # MinIO's client is a separate image from the MinIO server image.
    image: '${MINIO_MC_IMAGE:-minio/mc:RELEASE.2024-06-12T14-34-03Z}'
    pull_policy: '${MINIO_PULL_POLICY:-missing}'
    depends_on:
      - lens-minio
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Portainer}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Portainer}'
      MINIO_BUCKET: '${MINIO_BUCKET:-lens}'
    entrypoint: ['/bin/sh', '-ec']
    command: |
      until mc alias set local http://lens-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
        sleep 2;
      done
      mc mb --ignore-existing "local/$$MINIO_BUCKET"
      mc anonymous set download "local/$$MINIO_BUCKET/public"
      echo "MinIO bucket $$MINIO_BUCKET is ready"
    networks:
      - lens-network
    restart: 'no'

  lens-keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ['start-dev', '--http-port=8080']
    depends_on:
      lens-postgres-init:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_ADMIN: '${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in Portainer}'
      KEYCLOAK_ADMIN_PASSWORD: '${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in Portainer}'
      KC_DB: postgres
      KC_DB_URL_HOST: lens-postgres
      KC_DB_URL_PORT: '5432'
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: '${POSTGRES_USER:-lens-postgres}'
      KC_DB_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}'
    ports:
      - '${KEYCLOAK_HOST_PORT:-8089}:8080'
    networks:
      - lens-network
    restart: unless-stopped

volumes:
  postgres-data:
    name: lens-pg-data
  redis-data:
    name: lens-redis-data
  minio-data:
    name: lens-minio-data

# This stack creates the shared network. backend-stack.yml joins it as external.
networks:
  lens-network:
    name: lens-network
