services:
  lens-backend:
    # Registry mode uses IMAGE_REGISTRY/IMAGE_OWNER/IMAGE_TAG. For a local
    # image imported into Portainer, set BACKEND_IMAGE and use pull policy
    # `never` so Compose does not contact the registry.
    container_name: lens-backend
    image: '${BACKEND_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-lensexe}/lens-backend:${IMAGE_TAG:-latest}}'
    pull_policy: '${BACKEND_PULL_POLICY:-always}'
    environment:
      API_GATEWAY_ENABLED: '${API_GATEWAY_ENABLED:-true}'
      API_PUBLIC_URL: '${API_PUBLIC_URL:-}'
      AI_API_ENABLED: '${AI_API_ENABLED:-false}'
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-http://ollama:11434}'
      AI_EMBEDDING_MODEL: '${AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}'
      AI_MODEL_TIMEOUT_MS: '${AI_MODEL_TIMEOUT_MS:-120000}'
      # AI uses a separate database (lens_ai) on the primary PostgreSQL server
      # by default. Override AI_DATABASE_URL or AI_DB_* for another server.
      AI_DATABASE_URL: '${AI_DATABASE_URL:-}'
      AI_DB_HOST: '${AI_DB_HOST:-${DB_HOST:-}}'
      AI_DB_PORT: '${AI_DB_PORT:-${DB_PORT:-5432}}'
      AI_DB_USERNAME: '${AI_DB_USERNAME:-${DB_USERNAME:-}}'
      AI_DB_PASSWORD: '${AI_DB_PASSWORD:-${DB_PASSWORD:-}}'
      AI_DB_NAME: '${AI_DB_NAME:-lens_ai}'
      AI_DB_LOGGING: '${AI_DB_LOGGING:-false}'
      AI_DB_POOL_MAX: '${AI_DB_POOL_MAX:-10}'
      COOKIE_DOMAIN: '${COOKIE_DOMAIN:-}'
      COOKIE_SECRET: '${COOKIE_SECRET:-}'
      CORS_ORIGINS: '${CORS_ORIGINS:-}'
      # Primary application database. Portainer supplies these values.
      DB_HOST: '${DB_HOST:-}'
      DB_LOGGING: '${DB_LOGGING:-false}'
      DB_NAME: '${DB_NAME:-}'
      DB_PASSWORD: '${DB_PASSWORD:-}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_SYNCHRONIZE: '${DB_SYNCHRONIZE:-false}'
      DB_USERNAME: '${DB_USERNAME:-}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET:-}'
      KAFKA_BROKERS: '${KAFKA_BROKERS:-kafka:9094}'
      KAFKA_CLIENT_ID: '${KAFKA_CLIENT_ID:-lens-backend}'
      KAFKA_ENABLED: '${KAFKA_ENABLED:-false}'
      KAFKA_MAIL_COMMANDS_TOPIC: '${KAFKA_MAIL_COMMANDS_TOPIC:-notification.mail.commands.v1}'
      KAFKA_NOTIFICATION_EVENTS_TOPIC: '${KAFKA_NOTIFICATION_EVENTS_TOPIC:-notification.events}'
      KAFKA_PASSWORD: '${KAFKA_PASSWORD:-}'
      KAFKA_SSL: '${KAFKA_SSL:-false}'
      KAFKA_USERNAME: '${KAFKA_USERNAME:-}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-}'
      JWT_SECRET: '${JWT_SECRET:-}'
      KEYCLOAK_ADMIN_CLIENT_ID: '${KEYCLOAK_ADMIN_CLIENT_ID:-}'
      KEYCLOAK_ADMIN_CLIENT_SECRET: '${KEYCLOAK_ADMIN_CLIENT_SECRET:-}'
      KEYCLOAK_ADMIN_PASSWORD: '${KEYCLOAK_ADMIN_PASSWORD:-}'
      KEYCLOAK_ADMIN_USERNAME: '${KEYCLOAK_ADMIN_USERNAME:-}'
      KEYCLOAK_AUTH_ENDPOINT: '${KEYCLOAK_AUTH_ENDPOINT:-}'
      KEYCLOAK_AUTH_SERVER_URL: '${KEYCLOAK_AUTH_SERVER_URL:-}'
      KEYCLOAK_CLIENT_ID: '${KEYCLOAK_CLIENT_ID:-}'
      KEYCLOAK_CLIENT_SECRET: '${KEYCLOAK_CLIENT_SECRET:-}'
      KEYCLOAK_GOOGLE_FRONTEND_REDIRECT_URI: '${KEYCLOAK_GOOGLE_FRONTEND_REDIRECT_URI:-}'
      KEYCLOAK_GOOGLE_REDIRECT_URI: '${KEYCLOAK_GOOGLE_REDIRECT_URI:-}'
      KEYCLOAK_REALM: '${KEYCLOAK_REALM:-}'
      KEYCLOAK_TOKEN_ENDPOINT: '${KEYCLOAK_TOKEN_ENDPOINT:-}'
      KEYCLOAK_URL: '${KEYCLOAK_URL:-}'
      NODE_ENV: '${NODE_ENV:-production}'
      PAYOS_API_KEY: '${PAYOS_API_KEY:-}'
      PAYOS_PAYOUT_API_KEY: '${PAYOS_PAYOUT_API_KEY:-}'
      PAYOS_CANCEL_URL: '${PAYOS_CANCEL_URL:-}'
      PAYOS_CHECKSUM_KEY: '${PAYOS_CHECKSUM_KEY:-}'
      PAYOS_PAYOUT_CHECKSUM_KEY: '${PAYOS_PAYOUT_CHECKSUM_KEY:-}'
      PAYOS_CLIENT_ID: '${PAYOS_CLIENT_ID:-}'
      PAYOS_PAYOUT_CLIENT_ID: '${PAYOS_PAYOUT_CLIENT_ID:-}'
      PAYOS_RETURN_URL: '${PAYOS_RETURN_URL:-}'
      PAYOS_STANDALONE_TEST_ENABLED: '${PAYOS_STANDALONE_TEST_ENABLED:-false}'
      PAYMENT_PROVIDER: '${PAYMENT_PROVIDER:-}'
      PAYOUT_DESTINATION_ENCRYPTION_KEY: '${PAYOUT_DESTINATION_ENCRYPTION_KEY:-}'
      PORT: '${PORT:-3000}'
      BULLMQ_REDIS_DB: '${BULLMQ_REDIS_DB:-2}'
      REDIS_HOST: '${REDIS_HOST:-lens-redis}'
      REDIS_DB: '${REDIS_DB:-0}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      S3_CLOUD_ACCESS_KEY_ID: '${S3_CLOUD_ACCESS_KEY_ID:-}'
      S3_CLOUD_BUCKET: '${S3_CLOUD_BUCKET:-}'
      S3_CLOUD_ENDPOINT: '${S3_CLOUD_ENDPOINT:-}'
      S3_CLOUD_PRESIGNED_URL_TTL_SECONDS: '${S3_CLOUD_PRESIGNED_URL_TTL_SECONDS:-}'
      S3_CLOUD_PUBLIC_ENDPOINT: '${S3_CLOUD_PUBLIC_ENDPOINT:-}'
      S3_CLOUD_REGION: '${S3_CLOUD_REGION:-}'
      S3_CLOUD_SECRET_ACCESS_KEY: '${S3_CLOUD_SECRET_ACCESS_KEY:-}'
      S3_MINIO_ACCESS_KEY_ID: '${S3_MINIO_ACCESS_KEY_ID:-}'
      S3_MINIO_BUCKET: '${S3_MINIO_BUCKET:-}'
      S3_MINIO_ENDPOINT: '${S3_MINIO_ENDPOINT:-}'
      S3_MINIO_PRESIGNED_URL_TTL_SECONDS: '${S3_MINIO_PRESIGNED_URL_TTL_SECONDS:-}'
      S3_MINIO_PUBLIC_ENDPOINT: '${S3_MINIO_PUBLIC_ENDPOINT:-}'
      S3_MINIO_REGION: '${S3_MINIO_REGION:-}'
      S3_MINIO_SECRET_ACCESS_KEY: '${S3_MINIO_SECRET_ACCESS_KEY:-}'
      S3_PROVIDER: '${S3_PROVIDER:-}'
      SEPAY_ACCOUNT_NAME: '${SEPAY_ACCOUNT_NAME:-}'
      SEPAY_ACCOUNT_NUMBER: '${SEPAY_ACCOUNT_NUMBER:-}'
      SEPAY_BANK_CODE: '${SEPAY_BANK_CODE:-}'
      SEPAY_WEBHOOK_API_KEY: '${SEPAY_WEBHOOK_API_KEY:-}'
    networks:
      - lens-network
    restart: unless-stopped

networks:
  lens-network:
    external: true
    name: lens-network
